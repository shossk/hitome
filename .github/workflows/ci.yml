# TS 側の CI: 型チェック + E2E スモークテスト
#
# 撮影 (capture.yml) と分けている理由:
# - こちらは Godot 不要で数十秒で終わる。PR ごとに気軽に回したい
# - 撮影は重い (Godot ダウンロード + xvfb) ので main への push と nightly に限定する
#
# smoke-test は Godot の出力を模した偽ビルドで
# 投稿 → 差分検出 → 絞り込み → 報告 の一周を検証する (契約テスト兼用)。

name: ci

on:
  pull_request:
    branches:
      - main
      - release
  push:
    branches:
      - main
  merge_group:
    branches:
      - main

# cancel in-progress runs on new commits to same PR (github.event.number)
concurrency:
  group: ${{ github.workflow }}-${{ github.event.number || github.sha }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: 🔠 Lint project
    runs-on: ubuntu-24.04-arm

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/setup@84cb39b217b10273981911c288cd62326dc7c6d2 # v2.0.2
        with:
          cache: true
          install: false

      - name: 📦 Install dependencies
        run: pnpm install --filter . --ignore-scripts

      - name: 🔠 Lint project
        run: pnpm run lint

  types:
    name: 💪 Type check
    runs-on: ubuntu-24.04-arm

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/setup@84cb39b217b10273981911c288cd62326dc7c6d2 # v2.0.2
        with:
          cache: true

      - name: 💪 Type check
        run: pnpm run typecheck

  knip:
    name: 🧹 Unused code check
    runs-on: ubuntu-24.04-arm

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/setup@84cb39b217b10273981911c288cd62326dc7c6d2 # v2.0.2
        with:
          cache: true

      - name: 🧹 Check for unused code
        run: pnpm run knip

# TS 側の CI: 型チェック + E2E スモークテスト
#
# 撮影 (capture.yml) と分けている理由:
# - こちらは Godot 不要で数十秒で終わる。PR ごとに気軽に回したい
# - 撮影は重い (Godot ダウンロード + xvfb) ので main への push と nightly に限定する
#
# smoke-test は Godot の出力を模した偽ビルドで
# 投稿 → 差分検出 → 絞り込み → 報告 の一周を検証する (契約テスト兼用)。

name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/setup@84cb39b217b10273981911c288cd62326dc7c6d2 # v2.0.2
        with:
          cache: true

      - name: Typecheck
        run: pnpm typecheck

      - name: Smoke test (server + uploader + diff)
        run: pnpm smoke-test
